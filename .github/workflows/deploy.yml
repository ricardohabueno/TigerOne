name: Deploy TigerOne to DigitalOcean VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "=== 0. Configurando fuso horário do servidor para São Paulo ==="
          sudo timedatectl set-timezone America/Sao_Paulo

          echo "=== 1. Entrando na pasta e puxando o código novo ==="
          cd /root/TigerOne
          git pull origin main

          echo "=== 2. Atualizando dependências no ambiente virtual ==="
          ./venv/bin/pip install -r requirements.txt

          echo "=== 3. Atualizando arquivo de serviço do systemd ==="
          sudo python3 -c '
with open("/etc/systemd/system/tigerone.service", "w") as f:
    f.write("""[Unit]
Description=TigerOne Campanhas Inteligentes API
After=network.target

[Service]
User=root
WorkingDirectory=/root/TigerOne
Environment="TZ=America/Sao_Paulo"
ExecStart=/root/TigerOne/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
""")'

          echo "=== 4. Recarregando daemons e reiniciando o serviço ==="
          sudo systemctl daemon-reload
          sudo systemctl restart tigerone

          echo "=== Deploy finalizado com sucesso! ==="
